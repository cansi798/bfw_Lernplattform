<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wordle Tag 8 — Besprechungen nachbereiten & Protokoll</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bfw-primary:#0EA5A4; --bfw-primary-dark:#0F766E; --bfw-accent:#F59E0B;
  --bfw-ink:#0F172A; --bfw-ink-soft:#475569; --bfw-bg:#FAFAFA; --bfw-bg-soft:#F8FAFC;
  --bfw-bg-teal:#ECFEFF; --bfw-border:#E2E8F0;
  --g-correct:#10B981; --g-present:#F59E0B; --g-absent:#94A3B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(180deg, var(--bfw-bg-teal) 0%, var(--bfw-bg) 240px); color: var(--bfw-ink); min-height: 100vh; padding: 1.5rem 1rem 3rem; }
.container { max-width: 560px; margin: 0 auto; }
header { text-align: center; margin-bottom: 1rem; }
.tag-pill { display: inline-block; padding: 0.4rem 1rem; background: var(--bfw-primary); color: white; border-radius: 999px; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.75rem; }
h1 { font-size: 1.6rem; color: var(--bfw-primary-dark); }
.hint { background: white; border: 1px solid var(--bfw-border); border-left: 4px solid var(--bfw-accent); border-radius: 10px; padding: 0.85rem 1.1rem; margin-bottom: 1rem; font-size: 1rem; line-height: 1.45; }
.hint b { color: var(--bfw-primary-dark); }
.grid { display: grid; gap: 6px; justify-content: center; margin-bottom: 1rem; }
.row { display: grid; gap: 6px; }
.tile { width: 46px; height: 46px; border: 2px solid var(--bfw-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; background: white; transition: transform 0.1s; }
.tile.filled { border-color: var(--bfw-ink-soft); }
.tile.correct { background: var(--g-correct); border-color: var(--g-correct); color: white; }
.tile.present { background: var(--g-present); border-color: var(--g-present); color: white; }
.tile.absent { background: var(--g-absent); border-color: var(--g-absent); color: white; }
.msg { text-align: center; min-height: 1.6rem; font-weight: 600; margin-bottom: 0.75rem; }
.msg.win { color: var(--g-correct); } .msg.lose { color: #EF4444; }
.keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.krow { display: flex; gap: 5px; justify-content: center; width: 100%; }
.key { flex: 1; min-width: 26px; max-width: 44px; height: 52px; border: none; border-radius: 7px; background: #E2E8F0; color: var(--bfw-ink); font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.key.wide { flex: 1.6; font-size: 0.75rem; max-width: 66px; }
.key.correct { background: var(--g-correct); color: white; } .key.present { background: var(--g-present); color: white; } .key.absent { background: var(--g-absent); color: white; }
.key:active { transform: translateY(1px); }
.controls { text-align: center; margin: 1rem 0; }
.btn { padding: 0.7rem 1.4rem; border: none; border-radius: 10px; background: var(--bfw-primary); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.stats { text-align: center; font-size: 0.85rem; color: var(--bfw-ink-soft); margin-top: 0.5rem; }
footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--bfw-ink-soft); }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="tag-pill">Tag 8 · Wordle</span>
    <h1>Besprechungen nachbereiten & Protokoll</h1>
  </header>
  <div class="hint" id="hint"><b>Hinweis:</b> <span id="hintText">…</span></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="controls"><button class="btn" onclick="newGame()">🔄 Neues Wort</button></div>
  <div class="stats" id="stats"></div>
  <footer>BFW Lernplattform · Büroprozesse (M-067) · © Can Siebert 2026</footer>
</div>
<script>
const DAY_ID = 'bp-tag8';
const WORDS = [{"word":"PROTOKOLL","hint":"Schriftliche Niederschrift über Inhalte, Verlauf und Ergebnisse einer Sitzung."},{"word":"VERTEILER","hint":"Festlegung, wer die fertige Niederschrift erhält (Teilnehmer, Abwesende, Vorgesetzte)."},{"word":"BESCHLUSS","hint":"Verbindliche Entscheidung einer Sitzung; wird wörtlich festgehalten."},{"word":"KONJUNKTIV","hint":"Möglichkeitsform für die indirekte Rede; Form I und II bei der Wiedergabe von Aussagen."},{"word":"INDIKATIV","hint":"Wirklichkeitsform; ungeeignet, weil sie Gesagtes als tatsächlich erscheinen lässt."},{"word":"PRÄSENS","hint":"Zeitform (Gegenwart), in der der Protokolltext üblicherweise geschrieben wird."},{"word":"GENEHMIGUNG","hint":"Verbindlichmachung durch Widerspruchsfrist oder Abstimmung in der nächsten Sitzung."},{"word":"MASSNAHME","hint":"Vereinbarte Aufgabe mit Verantwortlichem und Termin, die nachgehalten wird."},{"word":"BESPRECHUNG","hint":"Zusammenkunft zur gemeinsamen Beratung, die dokumentiert und nachbereitet wird."},{"word":"STICHWORT","hint":"Kurze Notiz während der Sitzung als Grundlage der späteren Niederschrift."},{"word":"ANWESENHEIT","hint":"Teilnahme an der Sitzung; zeitweise Fälle werden gesondert vermerkt."},{"word":"FORMULAR","hint":"Vorlage in Tabellenform mit Feldern zum direkten Eintragen der Ergebnisse."},{"word":"NIEDERSCHRIFT","hint":"Ursprüngliche Bedeutung des Begriffs; schriftliche Aufzeichnung über eine Veranstaltung."},{"word":"SITZUNG","hint":"Zusammenkunft mehrerer Personen zur Beratung, über die berichtet wird."},{"word":"VERSAMMLUNG","hint":"Zusammenkunft vieler Personen; ein möglicher Anlass für eine Niederschrift."},{"word":"KONFERENZ","hint":"Größere geschäftliche Zusammenkunft mit Beratung und Beschlussfassung."},{"word":"VERHANDLUNG","hint":"Gespräch zum Interessenausgleich; oft wörtlich mitgeschrieben."},{"word":"TAGESORDNUNG","hint":"Auflistung der zu behandelnden Punkte, nach denen die Sitzung gegliedert wird."},{"word":"WORTPROTOKOLL","hint":"Art, die alle Aussagen wörtlich wiedergibt; typisch für Gericht und Parlament."},{"word":"KURZPROTOKOLL","hint":"Zusammengefasste Art; in der kaufmännischen Praxis am häufigsten verwendet."},{"word":"VERLAUF","hint":"Ablauf der Sitzung mit Vorschlägen, Einwänden und Argumenten."},{"word":"GEDÄCHTNIS","hint":"Aus der Erinnerung; Grundlage einer nachträglich erstellten Zusammenfassung."},{"word":"PROTOKOLLKOPF","hint":"Anfang der Niederschrift mit Datum, Ort, Vorsitz, Teilnehmern und Tagesordnung."},{"word":"PROTOKOLLTEXT","hint":"Sachliche Wiedergabe des Wesentlichen, geordnet nach den Tagesordnungspunkten."},{"word":"PROTOKOLLFUSS","hint":"Schluss mit Ausfertigungsdatum, Unterschriften, ggf. Verteiler und Anlagen."},{"word":"UNTERSCHRIFT","hint":"Handschriftliche Bestätigung von Leitung und Schriftführer am Schluss."},{"word":"INFORMATION","hint":"Funktion einer Niederschrift: sie unterrichtet Abwesende und dient als Gedächtnisstütze."},{"word":"ORGANISATION","hint":"Funktion einer Niederschrift: Aufgabenverteilung festhalten, Kompetenzen festlegen."},{"word":"DOKUMENTATION","hint":"Funktion, die Beschlüsse aktenkundig macht und Entscheidungen belegt."},{"word":"BEWEIS","hint":"Nachweis von Beschlüssen; nur bei Originalunterschrift gegeben."},{"word":"NACHWEIS","hint":"Beleg über gefasste Beschlüsse und getroffene Entscheidungen."},{"word":"VORSITZ","hint":"Leitung der Sitzung; überprüft und ändert gegebenenfalls den Text."},{"word":"VORSITZENDER","hint":"Person, die die Sitzung leitet und die Niederschrift genehmigt."},{"word":"TEILNEHMER","hint":"Anwesende Person; bei vielen wird eine separate Liste geführt."},{"word":"ABSTIMMUNG","hint":"Verfahren zur Genehmigung in der nächsten Sitzung oder über einen Antrag."},{"word":"WIDERSPRUCH","hint":"Einspruch innerhalb einer Frist gegen die vorgelegte Niederschrift."},{"word":"ANTRAG","hint":"Formulierter Vorschlag, der wörtlich festgehalten und zum Beschluss erhoben werden kann."},{"word":"EINWAND","hint":"Gegenargument im Sitzungsverlauf, das ggf. mit Namenshinweis vermerkt wird."},{"word":"ARGUMENT","hint":"Begründung im Verlauf, die zum Zustandekommen einer Entscheidung beiträgt."},{"word":"VORSCHLAG","hint":"Anregung im Sitzungsverlauf, über die beraten und abgestimmt wird."},{"word":"AUFGABE","hint":"Das \"Was\" einer Maßnahmenliste; mit Verantwortlichem und Termin zu versehen."},{"word":"TERMIN","hint":"Das \"Bis wann\" einer Maßnahmenliste; macht eine Aufgabe verbindlich."},{"word":"KOMPETENZ","hint":"Zuständigkeit, die in der Niederschrift festgelegt und verbindlich gemacht wird."},{"word":"VEREINBARUNG","hint":"Getroffene Abmachung, die durch Unterschrift und Genehmigung verbindlich wird."},{"word":"GESPRÄCH","hint":"Unterredung, etwa am Telefon, die in einer kurzen Notiz festgehalten wird."},{"word":"NOTIZ","hint":"Kurze Aufzeichnung, oft als persönliche Gedächtnisstütze zu einem Telefonat."},{"word":"AKTENNOTIZ","hint":"Deutlich kürzere Zusammenfassung eines Gesprächs für die Ablage."},{"word":"VORLAGE","hint":"Muster in Tabellenform mit Feldern; sichert einen einheitlichen Aufbau."},{"word":"TABELLE","hint":"Gitterform des Formulars, in die TOP und Ergebnisse eingetragen werden."},{"word":"NORM","hint":"Regelwerk (DIN 5008) für Schreib- und Gestaltungsregeln der Niederschrift."},{"word":"ADJEKTIV","hint":"Wertendes oder ausschmückendes Wort, auf das der Schriftführer verzichtet."},{"word":"NEUTRAL","hint":"Haltung des Schriftführers: objektiv, ohne eigene Wertung."},{"word":"SACHLICH","hint":"Nüchterne Sprache der Niederschrift, ohne ausschmückende Wörter."},{"word":"ANLAGE","hint":"Beigefügtes Dokument, das am Schluss der Niederschrift genannt wird."},{"word":"DATUM","hint":"Zeitangabe im Kopf und beim Ausfertigen der Niederschrift."},{"word":"NACHBEREITUNG","hint":"Systematisches Nachhalten vereinbarter Maßnahmen nach einer Zusammenkunft."},{"word":"ERGEBNIS","hint":"Resultat der Sitzung; steht im Kurzprotokoll im Vordergrund."},{"word":"FRIST","hint":"Zeitraum für einen Widerspruch, nach dessen Ablauf das Protokoll gilt."},{"word":"AUFBEWAHRUNG","hint":"Sorgfältiges Verwahren der Niederschrift mit Originalunterschrift."},{"word":"REDNER","hint":"Namentlich erwähnter Sprecher, dessen Beitrag objektiv wiedergegeben wird."},{"word":"LEITUNG","hint":"Vorsitz der Sitzung, der die Niederschrift am Schluss unterzeichnet."},{"word":"ENTSCHEIDUNG","hint":"Festlegung, die aktenkundig gemacht und rechtswirksam werden kann."},{"word":"WIEDERGABE","hint":"Darstellung des Gesagten, im Protokolltext zusammengefasst und präzise."},{"word":"GEGENWART","hint":"Zeitform Präsens, in der der Text üblicherweise verfasst wird."}];
const MAX_ROWS = 6;
const LAYOUT = [['Q','W','E','R','T','Z','U','I','O','P','Ü'],['A','S','D','F','G','H','J','K','L','Ö','Ä'],['ENTER','Y','X','C','V','B','N','M','ß','DEL']];
const STORAGE = 'wordle_' + DAY_ID;

let target='', hint='', row=0, col=0, guesses=[], over=false, keyState={}, lastIdx=-1;
function pickWord(){ let i; do { i=Math.floor(Math.random()*WORDS.length); } while(WORDS.length>1 && i===lastIdx); lastIdx=i; return WORDS[i]; }

function loadStats(){ try { return JSON.parse(localStorage.getItem(STORAGE)) || {played:0,won:0}; } catch(e){ return {played:0,won:0}; } }
function saveStats(s){ try { localStorage.setItem(STORAGE, JSON.stringify(s)); } catch(e){} }
function renderStats(){ const s=loadStats(); document.getElementById('stats').textContent = `Gespielt: ${s.played} · Gewonnen: ${s.won}`; }

function newGame(){
  const pick = pickWord();
  target = pick.word.toUpperCase(); hint = pick.hint;
  row=0; col=0; over=false; guesses=Array.from({length:MAX_ROWS},()=>''); keyState={};
  document.getElementById('hintText').textContent = hint;
  document.getElementById('msg').textContent=''; document.getElementById('msg').className='msg';
  buildGrid(); buildKeyboard();
}

function buildGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  g.style.gridTemplateRows=`repeat(${MAX_ROWS}, auto)`;
  // adaptive Kachelgröße, damit auch lange Wörter (bis 14) passen
  const avail = Math.min(520, (g.clientWidth || 520));
  const size = Math.max(28, Math.min(46, Math.floor((avail - (target.length-1)*6) / target.length)));
  const fs = Math.round(size*0.55);
  for(let r=0;r<MAX_ROWS;r++){
    const rowEl=document.createElement('div'); rowEl.className='row';
    rowEl.style.gridTemplateColumns=`repeat(${target.length}, ${size}px)`;
    for(let c=0;c<target.length;c++){ const t=document.createElement('div'); t.className='tile'; t.id=`t-${r}-${c}`; t.style.width=size+'px'; t.style.height=size+'px'; t.style.fontSize=fs+'px'; rowEl.appendChild(t); }
    g.appendChild(rowEl);
  }
}

function buildKeyboard(){
  const kb=document.getElementById('keyboard'); kb.innerHTML='';
  LAYOUT.forEach(rw=>{
    const rowEl=document.createElement('div'); rowEl.className='krow';
    rw.forEach(k=>{
      const b=document.createElement('button'); b.className='key'+(k==='ENTER'||k==='DEL'?' wide':'');
      b.textContent = k==='DEL'?'⌫':k; b.dataset.key=k;
      if(keyState[k]) b.classList.add(keyState[k]);
      b.onclick=()=>press(k);
      rowEl.appendChild(b);
    });
    kb.appendChild(rowEl);
  });
}

function press(k){
  if(over) return;
  if(k==='ENTER'){ submit(); return; }
  if(k==='DEL'){ if(col>0){ col--; guesses[row]=guesses[row].slice(0,-1); paintCurrent(); } return; }
  if(col<target.length){ guesses[row]+=k; col++; paintCurrent(); }
}

function paintCurrent(){
  for(let c=0;c<target.length;c++){ const t=document.getElementById(`t-${row}-${c}`); const ch=guesses[row][c]||''; t.textContent=ch; t.classList.toggle('filled', !!ch); }
}

function submit(){
  const guess=guesses[row];
  if(guess.length!==target.length){ flash('Bitte '+target.length+' Buchstaben eingeben.'); return; }
  // Färbung mit Duplikat-Behandlung
  const res=new Array(target.length).fill('absent');
  const counts={};
  for(const ch of target) counts[ch]=(counts[ch]||0)+1;
  for(let c=0;c<target.length;c++){ if(guess[c]===target[c]){ res[c]='correct'; counts[guess[c]]--; } }
  for(let c=0;c<target.length;c++){ if(res[c]==='correct') continue; if(counts[guess[c]]>0){ res[c]='present'; counts[guess[c]]--; } }
  for(let c=0;c<target.length;c++){
    const t=document.getElementById(`t-${row}-${c}`); t.classList.add(res[c]);
    const k=guess[c]; const rank={absent:0,present:1,correct:2};
    if(!keyState[k] || rank[res[c]]>rank[keyState[k]]) keyState[k]=res[c];
  }
  buildKeyboard();
  if(guess===target){ win(); return; }
  row++; col=0;
  if(row>=MAX_ROWS){ lose(); }
}

function win(){ over=true; const m=document.getElementById('msg'); m.textContent='🎉 Richtig! '+target; m.className='msg win'; const s=loadStats(); s.played++; s.won++; saveStats(s); renderStats(); }
function lose(){ over=true; const m=document.getElementById('msg'); m.textContent='Schade! Das Wort war: '+target; m.className='msg lose'; const s=loadStats(); s.played++; saveStats(s); renderStats(); }
function flash(txt){ const m=document.getElementById('msg'); m.textContent=txt; setTimeout(()=>{ if(!over) m.textContent=''; }, 1500); }

document.addEventListener('keydown', e=>{
  if(e.key==='Enter') press('ENTER');
  else if(e.key==='Backspace') press('DEL');
  else { const c=e.key.toUpperCase(); if(/^[A-ZÄÖÜß]$/.test(c)) press(c); }
});

renderStats(); newGame();
</script>
</body>
</html>
