<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wordle Tag 12 — Dokumentenmanagement: Aufbewahrung & Fristen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bfw-primary:#0EA5A4; --bfw-primary-dark:#0F766E; --bfw-accent:#F59E0B;
  --bfw-ink:#0F172A; --bfw-ink-soft:#475569; --bfw-bg:#FAFAFA; --bfw-bg-soft:#F8FAFC;
  --bfw-bg-teal:#ECFEFF; --bfw-border:#E2E8F0;
  --g-correct:#10B981; --g-present:#F59E0B; --g-absent:#94A3B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(180deg, var(--bfw-bg-teal) 0%, var(--bfw-bg) 240px); color: var(--bfw-ink); min-height: 100vh; padding: 1.5rem 1rem 3rem; }
.container { max-width: 560px; margin: 0 auto; }
header { text-align: center; margin-bottom: 1rem; }
.tag-pill { display: inline-block; padding: 0.4rem 1rem; background: var(--bfw-primary); color: white; border-radius: 999px; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.75rem; }
h1 { font-size: 1.6rem; color: var(--bfw-primary-dark); }
.hint { background: white; border: 1px solid var(--bfw-border); border-left: 4px solid var(--bfw-accent); border-radius: 10px; padding: 0.85rem 1.1rem; margin-bottom: 1rem; font-size: 1rem; line-height: 1.45; }
.hint b { color: var(--bfw-primary-dark); }
.grid { display: grid; gap: 6px; justify-content: center; margin-bottom: 1rem; }
.row { display: grid; gap: 6px; }
.tile { width: 46px; height: 46px; border: 2px solid var(--bfw-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; background: white; transition: transform 0.1s; }
.tile.filled { border-color: var(--bfw-ink-soft); }
.tile.correct { background: var(--g-correct); border-color: var(--g-correct); color: white; }
.tile.present { background: var(--g-present); border-color: var(--g-present); color: white; }
.tile.absent { background: var(--g-absent); border-color: var(--g-absent); color: white; }
.msg { text-align: center; min-height: 1.6rem; font-weight: 600; margin-bottom: 0.75rem; }
.msg.win { color: var(--g-correct); } .msg.lose { color: #EF4444; }
.keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.krow { display: flex; gap: 5px; justify-content: center; width: 100%; }
.key { flex: 1; min-width: 26px; max-width: 44px; height: 52px; border: none; border-radius: 7px; background: #E2E8F0; color: var(--bfw-ink); font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.key.wide { flex: 1.6; font-size: 0.75rem; max-width: 66px; }
.key.correct { background: var(--g-correct); color: white; } .key.present { background: var(--g-present); color: white; } .key.absent { background: var(--g-absent); color: white; }
.key:active { transform: translateY(1px); }
.controls { text-align: center; margin: 1rem 0; }
.btn { padding: 0.7rem 1.4rem; border: none; border-radius: 10px; background: var(--bfw-primary); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.stats { text-align: center; font-size: 0.85rem; color: var(--bfw-ink-soft); margin-top: 0.5rem; }
footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--bfw-ink-soft); }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="tag-pill">Tag 12 · Wordle</span>
    <h1>Dokumentenmanagement: Aufbewahrung & Fristen</h1>
  </header>
  <div class="hint" id="hint"><b>Hinweis:</b> <span id="hintText">…</span></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="controls"><button class="btn" onclick="newGame()">🔄 Neues Wort</button></div>
  <div class="stats" id="stats"></div>
  <footer>BFW Lernplattform · Büroprozesse (M-067) · © Can Siebert 2026</footer>
</div>
<script>
const DAY_ID = 'bp-tag12';
const WORDS = [{"word":"SCHRIFTGUT","hint":"Alle in einem Unternehmen anfallenden Unterlagen in geschriebener oder gedruckter Form."},{"word":"REGISTRATUR","hint":"Geordnete Aufbewahrung und Verwaltung der Unterlagen; „Gedächtnis des Unternehmens\"."},{"word":"TAGESWERT","hint":"Wertigkeitsstufe ohne bleibenden Wert; nach Kenntnisnahme vernichtbar (z. B. Prospekt)."},{"word":"PRÜFWERT","hint":"Wertigkeitsstufe von begrenzter Bedeutung; nach der Kontrolle wird über Vernichtung entschieden."},{"word":"DAUERWERT","hint":"Wertigkeitsstufe von besonderer Bedeutung; aufzubewahren, solange das Unternehmen besteht."},{"word":"AKTENPLAN","hint":"Systematische Gliederung für eine nachvollziehbare Ordnung des Schriftguts."},{"word":"FRISTBEGINN","hint":"Setzt mit dem Schluss des Kalenderjahres ein, in dem das Schriftstück entstand."},{"word":"HANDELSBUCH","hint":"Aufzeichnung der Geschäftsvorfälle; Aufbewahrungsfrist 10 Jahre."},{"word":"KONTOAUSZUG","hint":"Beleg der Bank über Kontobewegungen; ein typischer Buchungsbeleg."},{"word":"ARCHIV","hint":"Zentrale Aufbewahrung selten benötigter, aber noch aufbewahrungspflichtiger Unterlagen."},{"word":"INVENTAR","hint":"Verzeichnis aller Vermögensgegenstände und Schulden; 10 Jahre aufzubewahren."},{"word":"MAHNUNG","hint":"Schriftliche Zahlungserinnerung an einen säumigen Schuldner."},{"word":"HANDELSBRIEF","hint":"Jedes Schriftstück, das ein Handelsgeschäft betrifft; 6 Jahre aufzubewahren."},{"word":"BUCHUNGSBELEG","hint":"Nachweis für eine Buchung (z. B. Rechnung, Quittung); seit BEG IV 8 Jahre."},{"word":"GESETZESWERT","hint":"Wertigkeitsstufe mit vorgeschriebener Aufbewahrungsfrist nach HGB und AO."},{"word":"GESCHÄFTSBRIEF","hint":"Schreiben im Geschäftsverkehr; nicht jedes zählt als Handelsbrief."},{"word":"RECHNUNG","hint":"Zahlungsaufforderung für gelieferte Ware oder Leistung; ein Buchungsbeleg."},{"word":"QUITTUNG","hint":"Schriftliche Bestätigung über eine empfangene Zahlung."},{"word":"BELEG","hint":"Schriftlicher Nachweis für einen Geschäftsvorfall."},{"word":"FRIST","hint":"Gesetzlich bestimmter Zeitraum, in dem Unterlagen aufbewahrt werden müssen."},{"word":"FRISTENDE","hint":"Zeitpunkt, an dem die Aufbewahrungspflicht ausläuft; stets ein 31. Dezember."},{"word":"KALENDERJAHR","hint":"Zeitraum vom 1. Januar bis 31. Dezember; sein Schluss löst den Fristbeginn aus."},{"word":"AUFBEWAHRUNG","hint":"Geordnetes Verwahren von Unterlagen über eine bestimmte Dauer."},{"word":"LAGEBERICHT","hint":"Darstellung von Geschäftsverlauf und Lage; 10 Jahre aufzubewahren."},{"word":"BILANZ","hint":"Gegenüberstellung von Vermögen und Schulden zum Abschlussstichtag."},{"word":"BEWEISKRAFT","hint":"Eigenschaft eines unveränderten Belegs, vor Gericht oder Finanzamt zu gelten."},{"word":"FINANZAMT","hint":"Behörde, die die Buchführung nach der Abgabenordnung prüft."},{"word":"BUCHFÜHRUNG","hint":"Systematische Aufzeichnung aller Geschäftsvorfälle."},{"word":"ABGABENORDNUNG","hint":"Steuerliches Grundgesetz mit Regelungen zu Aufbewahrungspflichten (§ 147)."},{"word":"STEUERRECHT","hint":"Rechtsgebiet, das Prüfbarkeit und Aufbewahrung für das Finanzamt regelt."},{"word":"KAUFMANN","hint":"Person, die ein Handelsgewerbe betreibt; nach HGB buchführungspflichtig."},{"word":"KAUFVERTRAG","hint":"Vereinbarung über Kauf und Verkauf einer Ware; anfallendes Schriftgut."},{"word":"ANGEBOT","hint":"Verbindliche Offerte eines Lieferanten; verlangt hat es oft Prüfwert."},{"word":"ANFRAGE","hint":"Bitte an einen Lieferanten um ein Angebot."},{"word":"KÜNDIGUNG","hint":"Schriftliche Beendigung eines Vertrags, z. B. eines Arbeitsverhältnisses."},{"word":"ARBEITSVERTRAG","hint":"Schriftliche Vereinbarung zwischen Arbeitgeber und Beschäftigtem."},{"word":"PREISLISTE","hint":"Übersicht der Preise eines Anbieters; typisches Schriftgut mit Prüfwert."},{"word":"STATISTIK","hint":"Zahlenmäßige Auswertung; oft nur von begrenzter Bedeutung."},{"word":"PROSPEKT","hint":"Werbematerial ohne bleibenden Wert; nach Kenntnisnahme vernichtbar."},{"word":"ZEITUNG","hint":"Täglich erscheinendes Druckwerk; typisches Schriftgut mit Tageswert."},{"word":"WERBUNG","hint":"Unverlangte Anpreisung; zählt nicht als Handelsbrief."},{"word":"PATENT","hint":"Gewerbliches Schutzrecht; die Unterlagen haben Dauerwert."},{"word":"GRÜNDUNG","hint":"Entstehung des Unternehmens; die zugehörigen Unterlagen haben Dauerwert."},{"word":"WERTIGKEIT","hint":"Einstufung des Schriftguts nach seiner Bedeutung und Aufbewahrungsdauer."},{"word":"ORDNUNG","hint":"Übersichtliches System der Ablage nach einem festen Prinzip."},{"word":"ABLAGE","hint":"Das Verwahren von Schriftstücken an einem festgelegten Ort."},{"word":"ABLAGEORT","hint":"Stelle, an der Schriftgut verwahrt wird; je häufiger genutzt, desto näher am Platz."},{"word":"EINZELAKTE","hint":"Aktenart, bei der ein Vorgang für sich abgelegt wird."},{"word":"SAMMELAKTE","hint":"Aktenart, bei der mehrere gleichartige Vorgänge zusammengefasst werden."},{"word":"AKTENART","hint":"Überlegung, ob als Einzel- oder Sammelmappe abgelegt wird."},{"word":"ARBEITSPLATZ","hint":"Ort der dezentralen Ablage für häufig benötigte Unterlagen."},{"word":"ABTEILUNG","hint":"Organisationseinheit mit gemeinsam genutzter, nachvollziehbarer Ablage."},{"word":"DATENTRÄGER","hint":"Medium zur elektronischen Speicherung von Unterlagen."},{"word":"VERNICHTUNG","hint":"Endgültige Beseitigung von Schriftgut nach Fristablauf."},{"word":"KENNTNISNAHME","hint":"Zur-Kenntnis-Nehmen; danach darf Schriftgut mit Tageswert weg."},{"word":"GESCHÄFTSJAHR","hint":"Zwölfmonatiger Zeitraum der Rechnungslegung eines Betriebs."},{"word":"DOKUMENTATION","hint":"Festhalten und Nachweis der Geschäftsvorfälle für Prüfzwecke."},{"word":"LESBARKEIT","hint":"Anforderung, dass digitale Unterlagen jederzeit wieder darstellbar sind."},{"word":"DATENZUGRIFF","hint":"Recht des Finanzamts, auf elektronische Unterlagen zuzugreifen (GoBD)."},{"word":"SCHRIFTSTÜCK","hint":"Einzelnes Dokument, das einen Vorgang festhält."},{"word":"UNTERLAGEN","hint":"Sammelbegriff für die aufzubewahrenden Dokumente eines Betriebs."},{"word":"AUFZEICHNUNG","hint":"Schriftliche Festhaltung von Vorgängen, die aufzubewahren ist."},{"word":"ORDNUNGSSYSTEM","hint":"Logisches Prinzip, nach dem Schriftstücke abgeheftet werden."},{"word":"ALTREGISTRATUR","hint":"Ablage für selten benötigte, aber noch aufbewahrungspflichtige Unterlagen."},{"word":"ZENTRALARCHIV","hint":"Gemeinsame zentrale Verwahrung, die einzelne Abteilungen entlastet."},{"word":"WIEDERGABE","hint":"Bildliche oder inhaltliche Darstellung eines Originals auf einem Datenträger."},{"word":"GEDÄCHTNIS","hint":"Bild für die Registratur als Speicher des betrieblichen Wissens."},{"word":"DOPPELABLAGE","hint":"Mehrfaches Verwahren desselben Vorgangs; durch den Katalog zu vermeiden."},{"word":"VERZEICHNIS","hint":"Geordnete Auflistung, z. B. aller Schriftstücke mit Frist und Ort."},{"word":"GLIEDERUNG","hint":"Systematische Aufteilung, die den Aktenplan strukturiert."}];
const MAX_ROWS = 6;
const LAYOUT = [['Q','W','E','R','T','Z','U','I','O','P','Ü'],['A','S','D','F','G','H','J','K','L','Ö','Ä'],['ENTER','Y','X','C','V','B','N','M','ß','DEL']];
const STORAGE = 'wordle_' + DAY_ID;

let target='', hint='', row=0, col=0, guesses=[], over=false, keyState={}, lastIdx=-1;
function pickWord(){ let i; do { i=Math.floor(Math.random()*WORDS.length); } while(WORDS.length>1 && i===lastIdx); lastIdx=i; return WORDS[i]; }

function loadStats(){ try { return JSON.parse(localStorage.getItem(STORAGE)) || {played:0,won:0}; } catch(e){ return {played:0,won:0}; } }
function saveStats(s){ try { localStorage.setItem(STORAGE, JSON.stringify(s)); } catch(e){} }
function renderStats(){ const s=loadStats(); document.getElementById('stats').textContent = `Gespielt: ${s.played} · Gewonnen: ${s.won}`; }

function newGame(){
  const pick = pickWord();
  target = pick.word.toUpperCase(); hint = pick.hint;
  row=0; col=0; over=false; guesses=Array.from({length:MAX_ROWS},()=>''); keyState={};
  document.getElementById('hintText').textContent = hint;
  document.getElementById('msg').textContent=''; document.getElementById('msg').className='msg';
  buildGrid(); buildKeyboard();
}

function buildGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  g.style.gridTemplateRows=`repeat(${MAX_ROWS}, auto)`;
  // adaptive Kachelgröße, damit auch lange Wörter (bis 14) passen
  const avail = Math.min(520, (g.clientWidth || 520));
  const size = Math.max(28, Math.min(46, Math.floor((avail - (target.length-1)*6) / target.length)));
  const fs = Math.round(size*0.55);
  for(let r=0;r<MAX_ROWS;r++){
    const rowEl=document.createElement('div'); rowEl.className='row';
    rowEl.style.gridTemplateColumns=`repeat(${target.length}, ${size}px)`;
    for(let c=0;c<target.length;c++){ const t=document.createElement('div'); t.className='tile'; t.id=`t-${r}-${c}`; t.style.width=size+'px'; t.style.height=size+'px'; t.style.fontSize=fs+'px'; rowEl.appendChild(t); }
    g.appendChild(rowEl);
  }
}

function buildKeyboard(){
  const kb=document.getElementById('keyboard'); kb.innerHTML='';
  LAYOUT.forEach(rw=>{
    const rowEl=document.createElement('div'); rowEl.className='krow';
    rw.forEach(k=>{
      const b=document.createElement('button'); b.className='key'+(k==='ENTER'||k==='DEL'?' wide':'');
      b.textContent = k==='DEL'?'⌫':k; b.dataset.key=k;
      if(keyState[k]) b.classList.add(keyState[k]);
      b.onclick=()=>press(k);
      rowEl.appendChild(b);
    });
    kb.appendChild(rowEl);
  });
}

function press(k){
  if(over) return;
  if(k==='ENTER'){ submit(); return; }
  if(k==='DEL'){ if(col>0){ col--; guesses[row]=guesses[row].slice(0,-1); paintCurrent(); } return; }
  if(col<target.length){ guesses[row]+=k; col++; paintCurrent(); }
}

function paintCurrent(){
  for(let c=0;c<target.length;c++){ const t=document.getElementById(`t-${row}-${c}`); const ch=guesses[row][c]||''; t.textContent=ch; t.classList.toggle('filled', !!ch); }
}

function submit(){
  const guess=guesses[row];
  if(guess.length!==target.length){ flash('Bitte '+target.length+' Buchstaben eingeben.'); return; }
  // Färbung mit Duplikat-Behandlung
  const res=new Array(target.length).fill('absent');
  const counts={};
  for(const ch of target) counts[ch]=(counts[ch]||0)+1;
  for(let c=0;c<target.length;c++){ if(guess[c]===target[c]){ res[c]='correct'; counts[guess[c]]--; } }
  for(let c=0;c<target.length;c++){ if(res[c]==='correct') continue; if(counts[guess[c]]>0){ res[c]='present'; counts[guess[c]]--; } }
  for(let c=0;c<target.length;c++){
    const t=document.getElementById(`t-${row}-${c}`); t.classList.add(res[c]);
    const k=guess[c]; const rank={absent:0,present:1,correct:2};
    if(!keyState[k] || rank[res[c]]>rank[keyState[k]]) keyState[k]=res[c];
  }
  buildKeyboard();
  if(guess===target){ win(); return; }
  row++; col=0;
  if(row>=MAX_ROWS){ lose(); }
}

function win(){ over=true; const m=document.getElementById('msg'); m.textContent='🎉 Richtig! '+target; m.className='msg win'; const s=loadStats(); s.played++; s.won++; saveStats(s); renderStats(); }
function lose(){ over=true; const m=document.getElementById('msg'); m.textContent='Schade! Das Wort war: '+target; m.className='msg lose'; const s=loadStats(); s.played++; saveStats(s); renderStats(); }
function flash(txt){ const m=document.getElementById('msg'); m.textContent=txt; setTimeout(()=>{ if(!over) m.textContent=''; }, 1500); }

document.addEventListener('keydown', e=>{
  if(e.key==='Enter') press('ENTER');
  else if(e.key==='Backspace') press('DEL');
  else { const c=e.key.toUpperCase(); if(/^[A-ZÄÖÜß]$/.test(c)) press(c); }
});

renderStats(); newGame();
</script>
</body>
</html>
