<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wordle Tag 14 — Digitales DMS, Datenschutz & Umweltschutz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bfw-primary:#0EA5A4; --bfw-primary-dark:#0F766E; --bfw-accent:#F59E0B;
  --bfw-ink:#0F172A; --bfw-ink-soft:#475569; --bfw-bg:#FAFAFA; --bfw-bg-soft:#F8FAFC;
  --bfw-bg-teal:#ECFEFF; --bfw-border:#E2E8F0;
  --g-correct:#10B981; --g-present:#F59E0B; --g-absent:#94A3B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(180deg, var(--bfw-bg-teal) 0%, var(--bfw-bg) 240px); color: var(--bfw-ink); min-height: 100vh; padding: 1.5rem 1rem 3rem; }
.container { max-width: 560px; margin: 0 auto; }
header { text-align: center; margin-bottom: 1rem; }
.tag-pill { display: inline-block; padding: 0.4rem 1rem; background: var(--bfw-primary); color: white; border-radius: 999px; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.75rem; }
h1 { font-size: 1.6rem; color: var(--bfw-primary-dark); }
.hint { background: white; border: 1px solid var(--bfw-border); border-left: 4px solid var(--bfw-accent); border-radius: 10px; padding: 0.85rem 1.1rem; margin-bottom: 1rem; font-size: 1rem; line-height: 1.45; }
.hint b { color: var(--bfw-primary-dark); }
.grid { display: grid; gap: 6px; justify-content: center; margin-bottom: 1rem; }
.row { display: grid; gap: 6px; }
.tile { width: 46px; height: 46px; border: 2px solid var(--bfw-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; background: white; transition: transform 0.1s; }
.tile.filled { border-color: var(--bfw-ink-soft); }
.tile.correct { background: var(--g-correct); border-color: var(--g-correct); color: white; }
.tile.present { background: var(--g-present); border-color: var(--g-present); color: white; }
.tile.absent { background: var(--g-absent); border-color: var(--g-absent); color: white; }
.msg { text-align: center; min-height: 1.6rem; font-weight: 600; margin-bottom: 0.75rem; }
.msg.win { color: var(--g-correct); } .msg.lose { color: #EF4444; }
.keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.krow { display: flex; gap: 5px; justify-content: center; width: 100%; }
.key { flex: 1; min-width: 26px; max-width: 44px; height: 52px; border: none; border-radius: 7px; background: #E2E8F0; color: var(--bfw-ink); font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.key.wide { flex: 1.6; font-size: 0.75rem; max-width: 66px; }
.key.correct { background: var(--g-correct); color: white; } .key.present { background: var(--g-present); color: white; } .key.absent { background: var(--g-absent); color: white; }
.key:active { transform: translateY(1px); }
.controls { text-align: center; margin: 1rem 0; }
.btn { padding: 0.7rem 1.4rem; border: none; border-radius: 10px; background: var(--bfw-primary); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.stats { text-align: center; font-size: 0.85rem; color: var(--bfw-ink-soft); margin-top: 0.5rem; }
footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--bfw-ink-soft); }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="tag-pill">Tag 14 · Wordle</span>
    <h1>Digitales DMS, Datenschutz & Umweltschutz</h1>
  </header>
  <div class="hint" id="hint"><b>Hinweis:</b> <span id="hintText">…</span></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="controls"><button class="btn" onclick="newGame()">🔄 Neues Wort</button></div>
  <div class="stats" id="stats"></div>
  <footer>BFW Lernplattform · Büroprozesse (M-067) · © Can Siebert 2026</footer>
</div>
<script>
const DAY_ID = 'bp-tag14';
const WORDS = [{"word":"WORKFLOW","hint":"Automatisch gesteuerter Ablauf von Bearbeitungs- und Freigabeschritten im DMS."},{"word":"DATENSCHUTZ","hint":"Schutz natürlicher Personen vor Missbrauch ihrer personenbezogenen Daten."},{"word":"GOBD","hint":"Grundsätze zur ordnungsmäßigen Führung und Aufbewahrung elektronischer Unterlagen."},{"word":"BDSG","hint":"Bundesgesetz, das die europäische Datenschutz-Grundverordnung national ergänzt."},{"word":"DSGVO","hint":"Europäische Grundverordnung als zentrale Rechtsgrundlage des Datenschutzes."},{"word":"RECYCLING","hint":"Verwertung von Altstoffen zu neuen Rohstoffen; Stufe der Abfallhierarchie."},{"word":"ELEKTROG","hint":"Gesetz zur umweltverträglichen Entsorgung von Elektro- und Elektronikgeräten."},{"word":"FIREWALL","hint":"Technische Schutzeinrichtung gegen unberechtigte Zugriffe aus dem Netz."},{"word":"PASSWORT","hint":"Geheime Zeichenfolge zur Zugriffskontrolle bei Benutzerkonten."},{"word":"LÖSCHUNG","hint":"„Recht auf Vergessenwerden“ nach Art. 17 DSGVO bei unzulässiger Speicherung."},{"word":"BETROFFENE","hint":"Personen, deren Daten erhoben, verarbeitet und genutzt werden."},{"word":"VIRENSCHUTZ","hint":"Programme zur Abwehr von Schadsoftware auf jedem Rechner."},{"word":"VERSIONIERUNG","hint":"Speicherung jeder Änderung als eigener Stand, ältere bleiben nachvollziehbar."},{"word":"ARCHIVIERUNG","hint":"Dauerhafte, geordnete Speicherung von Dokumenten über die Aufbewahrungsfrist."},{"word":"DATENSICHERUNG","hint":"Maßnahmen zum Schutz von Daten vor Verlust, Verfälschung und Diebstahl."},{"word":"BACKUP","hint":"Kopie von Daten zur Wiederherstellung nach einem Verlust."},{"word":"SPIEGELUNG","hint":"Parallele Datenhaltung auf zwei Platten als Schutz bei Rechnerausfall."},{"word":"NACHHALTIGKEIT","hint":"Ressourcen so nutzen, dass künftigen Generationen gleiche Mengen bleiben."},{"word":"UMWELTSCHUTZ","hint":"Alle Maßnahmen zur Vermeidung von Umweltbelastungen."},{"word":"UMWELTRECHT","hint":"Gesamtheit der gesetzlichen Regelungen zum Schutz der Natur."},{"word":"ABFALL","hint":"Stoff, den man loswerden will; unterliegt einer gesetzlichen Rangfolge."},{"word":"VERWERTUNG","hint":"Nutzung von Reststoffen als Rohstoff oder Energie statt Beseitigung."},{"word":"VERMEIDUNG","hint":"Oberste Stufe der Abfallhierarchie: gar nicht erst entstehen lassen."},{"word":"VERPACKUNG","hint":"Umhüllung von Waren; unterliegt Rücknahme- und Verwertungspflicht."},{"word":"VERPACKG","hint":"Gesetz seit 2019 zu Inverkehrbringen und Rücknahme von Umhüllungen."},{"word":"KRWG","hint":"Kreislaufwirtschaftsgesetz; legt in § 6 die Abfallhierarchie fest."},{"word":"AUSKUNFTSRECHT","hint":"Anspruch nach Art. 15 DSGVO auf Information über gespeicherte Daten."},{"word":"BERICHTIGUNG","hint":"Recht nach Art. 16 DSGVO auf Korrektur falscher Daten."},{"word":"WIDERSPRUCH","hint":"Einwand nach Art. 21 DSGVO gegen die Verarbeitung eigener Daten."},{"word":"DATENTRÄGER","hint":"Medium zur Speicherung, etwa Festplatte, Band, CD oder Stick."},{"word":"FESTPLATTE","hint":"Magnetisches Speichermedium im Rechner."},{"word":"MAGNETBAND","hint":"Magnetisches Medium zur Langzeitspeicherung großer Datenmengen."},{"word":"SPEICHERKARTE","hint":"Kleines mobiles Medium zur Datenablage in Kameras und Geräten."},{"word":"VOLLTEXTSUCHE","hint":"Schnelles Auffinden von Dokumenten über deren gesamten Inhalt."},{"word":"ABLAGE","hint":"Geordnete Aufbewahrung von Schriftgut, digital oder auf Papier."},{"word":"ORDNERSTRUKTUR","hint":"Hierarchische Gliederung der digitalen Ablage in Verzeichnisse."},{"word":"DATEIBENENNUNG","hint":"Einheitliche Regel, wie elektronische Dokumente bezeichnet werden."},{"word":"AUFBEWAHRUNG","hint":"Gesetzlich vorgeschriebenes Verwahren von Unterlagen für eine Frist."},{"word":"UNVERÄNDERBAR","hint":"Eine Kernanforderung revisionssicherer Speicherung: nicht nachträglich änderbar."},{"word":"VOLLSTÄNDIG","hint":"Kernanforderung revisionssicherer Speicherung: nichts fehlt."},{"word":"CLOUD","hint":"Online-Dienst mit ortsunabhängigem Zugriff auf Daten."},{"word":"HOMEOFFICE","hint":"Arbeiten von zu Hause mit ortsunabhängigem Datenzugriff."},{"word":"DATENBANK","hint":"System zur strukturierten Verwaltung großer Informationsmengen."},{"word":"DOKUMENT","hint":"Einzelnes Schriftstück, das im DMS verwaltet wird."},{"word":"FREIGABE","hint":"Genehmigungsschritt in einem gesteuerten Bearbeitungsablauf."},{"word":"BUCHUNG","hint":"Erfassung eines Geschäftsvorfalls, oft am Ende eines Prüfablaufs."},{"word":"SCHRIFTSTÜCK","hint":"Papiergebundene Unterlage, die digitalisiert werden kann."},{"word":"SCHULUNG","hint":"Unterweisung der Mitarbeiter zu Datenschutz und Sicherheit."},{"word":"ZUGRIFF","hint":"Möglichkeit, auf Daten zuzugreifen; muss kontrolliert werden."},{"word":"KENNZAHL","hint":"Geheime Nummer (PIN) als Schutz gegen unbefugte Nutzung."},{"word":"STROMAUSFALL","hint":"Ausfall der Energieversorgung; wird durch eine USV überbrückt."},{"word":"NOTSTROMANLAGE","hint":"Ersatzversorgung bei Ausfall des Stromnetzes."},{"word":"SICHERUNG","hint":"Schutzmaßnahme gegen Verlust oder Zerstörung von Daten."},{"word":"ZERSTÖRUNG","hint":"Unwiederbringlicher Verlust von Daten oder Datenträgern."},{"word":"DIEBSTAHL","hint":"Unberechtigte Wegnahme; eine Gefahr für die Datensicherheit."},{"word":"MISSBRAUCH","hint":"Unbefugte oder zweckwidrige Nutzung von Daten."},{"word":"KRIMINALITÄT","hint":"Straftaten am Computer, denen mit Zugriffskontrolle begegnet wird."},{"word":"PFANDFLASCHE","hint":"Beispiel für Wiederverwendung: gebrauchtes Gefäß für denselben Zweck."},{"word":"ALTPAPIER","hint":"Eine der drei Säulen des dualen Sammelsystems."},{"word":"GLAS","hint":"Wertstoff, der eingeschmolzen und wiederverwertet wird."},{"word":"MÜLLTONNE","hint":"Behälter für Abfall; durchgestrichen kennzeichnet er Elektro-Altgeräte."},{"word":"RESTMÜLL","hint":"Nicht verwertbarer Abfall; nicht für Elektro-Altgeräte geeignet."},{"word":"ENTSORGUNG","hint":"Umweltgerechte Beseitigung oder Verwertung von Abfällen."},{"word":"RÜCKNAHME","hint":"Pflicht großer Händler, Altgeräte kostenlos zurückzunehmen."},{"word":"HERSTELLER","hint":"Produzent; muss sich für Verpackungen und Elektrogeräte registrieren."},{"word":"UMWELTBLUME","hint":"EU-Siegel (Ecolabel), das den gesamten Lebenszyklus bewertet."},{"word":"UMWELTZEICHEN","hint":"Kennzeichnung umwelt- und gesundheitsfreundlicher Produkte."},{"word":"ECOLABEL","hint":"Englischer Name des EU-Umweltsiegels mit der Blume."},{"word":"LEBENSZYKLUS","hint":"Gesamte Lebensdauer eines Produkts von Herstellung bis Entsorgung."},{"word":"RESSOURCEN","hint":"Natürliche Rohstoffe, die durch nachhaltiges Handeln geschont werden."},{"word":"ENERGIE","hint":"Strom und Wärme, die im Büro bewusst gespart werden sollen."},{"word":"BILDSCHIRM","hint":"Anzeigegerät; beim Verlassen des Platzes abschalten spart Strom."},{"word":"DRUCKER","hint":"Ausgabegerät; nur bei Bedarf einschalten spart Energie."},{"word":"SOFTWARE","hint":"Programme eines Rechners; vor Verlust und Missbrauch zu schützen."},{"word":"HARDWARE","hint":"Physische Geräte eines Rechners; vor Verlust zu schützen."},{"word":"VERNICHTUNG","hint":"Sicheres Zerstören von Unterlagen nach Ablauf der Aufbewahrungsfrist."},{"word":"LÖSCHPFLICHT","hint":"Gebot, Daten nach Wegfall des Zwecks zu entfernen."},{"word":"PERSÖNLICHKEIT","hint":"Rechte der Person, die der Datenschutz vor Missbrauch bewahrt."},{"word":"BANKDATEN","hint":"Beispiel für personenbezogene Angaben zum Zahlungsverkehr."},{"word":"KREDITKARTE","hint":"Zahlungsmittel, dessen Nummer ein personenbezogenes Datum ist."},{"word":"UMVERPACKUNG","hint":"Zweite Hülle um die Verkaufsverpackung laut VerpackG."},{"word":"WEISUNGSFREI","hint":"Merkmal des Datenschutzbeauftragten bei seinen Kontrollaufgaben."},{"word":"ELEKTROGERÄT","hint":"Produkt, das nicht über den Restmüll entsorgt werden darf."},{"word":"SPEICHERUNG","hint":"Ablegen von Daten auf einem Medium."}];
const MAX_ROWS = 6;
const LAYOUT = [['Q','W','E','R','T','Z','U','I','O','P','Ü'],['A','S','D','F','G','H','J','K','L','Ö','Ä'],['ENTER','Y','X','C','V','B','N','M','ß','DEL']];
const STORAGE = 'wordle_' + DAY_ID;

let target='', hint='', row=0, col=0, guesses=[], over=false, keyState={}, lastIdx=-1;
function pickWord(){ let i; do { i=Math.floor(Math.random()*WORDS.length); } while(WORDS.length>1 && i===lastIdx); lastIdx=i; return WORDS[i]; }

function loadStats(){ try { return JSON.parse(localStorage.getItem(STORAGE)) || {played:0,won:0}; } catch(e){ return {played:0,won:0}; } }
function saveStats(s){ try { localStorage.setItem(STORAGE, JSON.stringify(s)); } catch(e){} }
function renderStats(){ const s=loadStats(); document.getElementById('stats').textContent = `Gespielt: ${s.played} · Gewonnen: ${s.won}`; }

function newGame(){
  const pick = pickWord();
  target = pick.word.toUpperCase(); hint = pick.hint;
  row=0; col=0; over=false; guesses=Array.from({length:MAX_ROWS},()=>''); keyState={};
  document.getElementById('hintText').textContent = hint;
  document.getElementById('msg').textContent=''; document.getElementById('msg').className='msg';
  buildGrid(); buildKeyboard();
}

function buildGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  g.style.gridTemplateRows=`repeat(${MAX_ROWS}, auto)`;
  // adaptive Kachelgröße, damit auch lange Wörter (bis 14) passen
  const avail = Math.min(520, (g.clientWidth || 520));
  const size = Math.max(28, Math.min(46, Math.floor((avail - (target.length-1)*6) / target.length)));
  const fs = Math.round(size*0.55);
  for(let r=0;r<MAX_ROWS;r++){
    const rowEl=document.createElement('div'); rowEl.className='row';
    rowEl.style.gridTemplateColumns=`repeat(${target.length}, ${size}px)`;
    for(let c=0;c<target.length;c++){ const t=document.createElement('div'); t.className='tile'; t.id=`t-${r}-${c}`; t.style.width=size+'px'; t.style.height=size+'px'; t.style.fontSize=fs+'px'; rowEl.appendChild(t); }
    g.appendChild(rowEl);
  }
}

function buildKeyboard(){
  const kb=document.getElementById('keyboard'); kb.innerHTML='';
  LAYOUT.forEach(rw=>{
    const rowEl=document.createElement('div'); rowEl.className='krow';
    rw.forEach(k=>{
      const b=document.createElement('button'); b.className='key'+(k==='ENTER'||k==='DEL'?' wide':'');
      b.textContent = k==='DEL'?'⌫':k; b.dataset.key=k;
      if(keyState[k]) b.classList.add(keyState[k]);
      b.onclick=()=>press(k);
      rowEl.appendChild(b);
    });
    kb.appendChild(rowEl);
  });
}

function press(k){
  if(over) return;
  if(k==='ENTER'){ submit(); return; }
  if(k==='DEL'){ if(col>0){ col--; guesses[row]=guesses[row].slice(0,-1); paintCurrent(); } return; }
  if(col<target.length){ guesses[row]+=k; col++; paintCurrent(); }
}

function paintCurrent(){
  for(let c=0;c<target.length;c++){ const t=document.getElementById(`t-${row}-${c}`); const ch=guesses[row][c]||''; t.textContent=ch; t.classList.toggle('filled', !!ch); }
}

function submit(){
  const guess=guesses[row];
  if(guess.length!==target.length){ flash('Bitte '+target.length+' Buchstaben eingeben.'); return; }
  // Färbung mit Duplikat-Behandlung
  const res=new Array(target.length).fill('absent');
  const counts={};
  for(const ch of target) counts[ch]=(counts[ch]||0)+1;
  for(let c=0;c<target.length;c++){ if(guess[c]===target[c]){ res[c]='correct'; counts[guess[c]]--; } }
  for(let c=0;c<target.length;c++){ if(res[c]==='correct') continue; if(counts[guess[c]]>0){ res[c]='present'; counts[guess[c]]--; } }
  for(let c=0;c<target.length;c++){
    const t=document.getElementById(`t-${row}-${c}`); t.classList.add(res[c]);
    const k=guess[c]; const rank={absent:0,present:1,correct:2};
    if(!keyState[k] || rank[res[c]]>rank[keyState[k]]) keyState[k]=res[c];
  }
  buildKeyboard();
  if(guess===target){ win(); return; }
  row++; col=0;
  if(row>=MAX_ROWS){ lose(); }
}

function win(){ over=true; const m=document.getElementById('msg'); m.textContent='🎉 Richtig! '+target; m.className='msg win'; const s=loadStats(); s.played++; s.won++; saveStats(s); renderStats(); }
function lose(){ over=true; const m=document.getElementById('msg'); m.textContent='Schade! Das Wort war: '+target; m.className='msg lose'; const s=loadStats(); s.played++; saveStats(s); renderStats(); }
function flash(txt){ const m=document.getElementById('msg'); m.textContent=txt; setTimeout(()=>{ if(!over) m.textContent=''; }, 1500); }

document.addEventListener('keydown', e=>{
  if(e.key==='Enter') press('ENTER');
  else if(e.key==='Backspace') press('DEL');
  else { const c=e.key.toUpperCase(); if(/^[A-ZÄÖÜß]$/.test(c)) press(c); }
});

renderStats(); newGame();
</script>
</body>
</html>
