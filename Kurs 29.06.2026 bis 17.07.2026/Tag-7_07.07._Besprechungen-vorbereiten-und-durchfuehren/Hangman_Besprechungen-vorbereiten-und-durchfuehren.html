<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hängemann Tag 7 — Besprechungen vorbereiten & durchführen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bfw-primary:#0EA5A4; --bfw-primary-dark:#0F766E; --bfw-accent:#F59E0B;
  --bfw-ink:#0F172A; --bfw-ink-soft:#475569; --bfw-bg:#FAFAFA;
  --bfw-bg-teal:#ECFEFF; --bfw-border:#E2E8F0; --bfw-success:#10B981; --bfw-danger:#EF4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(180deg, var(--bfw-bg-teal) 0%, var(--bfw-bg) 240px); color: var(--bfw-ink); min-height: 100vh; padding: 1.5rem 1rem 3rem; }
.container { max-width: 560px; margin: 0 auto; }
header { text-align: center; margin-bottom: 1rem; }
.tag-pill { display: inline-block; padding: 0.4rem 1rem; background: var(--bfw-primary); color: white; border-radius: 999px; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.75rem; }
h1 { font-size: 1.6rem; color: var(--bfw-primary-dark); }
.hint { background: white; border: 1px solid var(--bfw-border); border-left: 4px solid var(--bfw-accent); border-radius: 10px; padding: 0.85rem 1.1rem; margin-bottom: 1rem; font-size: 1rem; line-height: 1.45; }
.hint b { color: var(--bfw-primary-dark); }
.stage { display: flex; justify-content: center; margin-bottom: 0.5rem; }
.stage svg { width: 200px; height: 220px; }
.lives { text-align: center; font-size: 0.9rem; color: var(--bfw-ink-soft); margin-bottom: 0.75rem; }
.word { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 1rem; }
.slot { width: 34px; height: 44px; border-bottom: 4px solid var(--bfw-ink-soft); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; text-transform: uppercase; }
.slot.revealed { color: var(--bfw-primary-dark); }
.msg { text-align: center; min-height: 1.6rem; font-weight: 600; margin-bottom: 0.75rem; }
.msg.win { color: var(--bfw-success); } .msg.lose { color: var(--bfw-danger); }
.keyboard { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.key { width: 40px; height: 46px; border: none; border-radius: 8px; background: #E2E8F0; color: var(--bfw-ink); font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.key:disabled { cursor: default; opacity: 0.55; }
.key.right { background: var(--bfw-success); color: white; } .key.wrong { background: var(--bfw-danger); color: white; }
.key:active:not(:disabled) { transform: translateY(1px); }
.controls { text-align: center; margin: 1rem 0; }
.btn { padding: 0.7rem 1.4rem; border: none; border-radius: 10px; background: var(--bfw-primary); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.stats { text-align: center; font-size: 0.85rem; color: var(--bfw-ink-soft); margin-top: 0.5rem; }
footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--bfw-ink-soft); }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="tag-pill">Tag 7 · Hängemann</span>
    <h1>Besprechungen vorbereiten & durchführen</h1>
  </header>
  <div class="hint" id="hint"><b>Hinweis:</b> <span id="hintText">…</span></div>
  <div class="stage">
    <svg viewBox="0 0 200 220">
      <!-- Galgen -->
      <line x1="20" y1="210" x2="120" y2="210" stroke="#0F766E" stroke-width="6"/>
      <line x1="50" y1="210" x2="50" y2="20" stroke="#0F766E" stroke-width="6"/>
      <line x1="50" y1="20" x2="130" y2="20" stroke="#0F766E" stroke-width="6"/>
      <line x1="130" y1="20" x2="130" y2="45" stroke="#0F766E" stroke-width="6"/>
      <!-- Körperteile (per JS eingeblendet) -->
      <circle id="p0" cx="130" cy="62" r="17" stroke="#EF4444" stroke-width="4" fill="none" style="display:none"/>
      <line id="p1" x1="130" y1="79" x2="130" y2="140" stroke="#EF4444" stroke-width="4" style="display:none"/>
      <line id="p2" x1="130" y1="95" x2="105" y2="120" stroke="#EF4444" stroke-width="4" style="display:none"/>
      <line id="p3" x1="130" y1="95" x2="155" y2="120" stroke="#EF4444" stroke-width="4" style="display:none"/>
      <line id="p4" x1="130" y1="140" x2="110" y2="175" stroke="#EF4444" stroke-width="4" style="display:none"/>
      <line id="p5" x1="130" y1="140" x2="150" y2="175" stroke="#EF4444" stroke-width="4" style="display:none"/>
    </svg>
  </div>
  <div class="lives" id="lives"></div>
  <div class="word" id="word"></div>
  <div class="msg" id="msg"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="controls"><button class="btn" onclick="newGame()">🔄 Neues Wort</button></div>
  <div class="stats" id="stats"></div>
  <footer>BFW Lernplattform · Büroprozesse (M-067) · © Can Siebert 2026</footer>
</div>
<script>
const DAY_ID = 'bp-tag7';
const WORDS = [{"word":"MODERATION","hint":"Steuert die Diskussion: erteilt das Wort, fasst zusammen, hält Gruppe bei Thema und Zeit."},{"word":"EINLADUNG","hint":"Schriftliche Aufforderung zur Teilnahme mit allen Pflichtangaben."},{"word":"PROTOKOLL","hint":"Schriftliche Festhaltung von Verlauf, Ergebnissen und Beschlüssen einer Sitzung."},{"word":"SITZUNG","hint":"Zusammenkunft mehrerer Personen zur Information, Aussprache oder Entscheidung."},{"word":"LEITUNG","hint":"Eröffnet, führt und schließt die Zusammenkunft; achtet auf Ziel, Zeit und Ergebnisse."},{"word":"DISKUSSION","hint":"Aussprachephase, in der Argumente offen ausgetauscht werden."},{"word":"KONSENS","hint":"Einvernehmen, um das sich die Teilnehmer respektvoll bemühen."},{"word":"BESCHLUSS","hint":"Verbindliche Entscheidung, die in einer Sitzung gefasst und festgehalten wird."},{"word":"VERPFLEGUNG","hint":"Getränke und Snacks; halten die Konzentration und zeigen Wertschätzung."},{"word":"ZEITBEDARF","hint":"Voraussichtliche Dauer, die in der Einladung angegeben wird."},{"word":"ETIKETTE","hint":"Verhaltensregeln, etwa Mikrofon stumm und Kamera an bei Videokonferenzen."},{"word":"DAUERREDNER","hint":"Schwieriger Teilnehmertyp, der zu allem etwas zu sagen hat."},{"word":"TAGESORDNUNG","hint":"Geordnete Liste der in einer Sitzung zu behandelnden Themen."},{"word":"BESPRECHUNG","hint":"Betriebliches Treffen zum Austausch und zur Abstimmung über Themen."},{"word":"TEILNEHMER","hint":"Person, die zu einer Sitzung eingeladen ist und mitverantwortet."},{"word":"VIDEOKONFERENZ","hint":"Austausch per Bild und Ton über verschiedene Orte hinweg via Internet."},{"word":"KONFERENZ","hint":"Formelle Zusammenkunft mehrerer Personen zur Beratung."},{"word":"HYBRIDMEETING","hint":"Treffen mit einem Teil vor Ort und einem Teil online zugeschaltet."},{"word":"EINBERUFUNG","hint":"Formelles Ansetzen und Anordnen einer Versammlung."},{"word":"FRIST","hint":"Vorgegebener Mindestabstand, z. B. eine Woche vor der Versammlung."},{"word":"TERMIN","hint":"Vereinbarter Zeitpunkt, der mit allen Beteiligten abgestimmt wird."},{"word":"UNTERLAGEN","hint":"Zur Vorbereitung benötigte Dokumente, die vorab versendet werden."},{"word":"ANLAGEN","hint":"Beigefügte Zusatzdokumente, auf die in der Einladung verwiesen wird."},{"word":"ABLAUF","hint":"Zeitliche Abfolge der Punkte einer Zusammenkunft."},{"word":"ENTSCHEIDUNG","hint":"Ergebnis, mit dem eine Frage verbindlich geklärt wird."},{"word":"INFORMATION","hint":"Weitergabe von Wissen als mögliches Ziel eines Tagesordnungspunkts."},{"word":"AUSSPRACHE","hint":"Offener Meinungsaustausch über ein Thema."},{"word":"ZUSAMMENKUNFT","hint":"Treffen mehrerer Personen an einem Ort oder online."},{"word":"WERTSCHAETZUNG","hint":"Achtung gegenüber Teilnehmern, etwa durch Getränke und Aufmerksamkeit."},{"word":"KONZENTRATION","hint":"Geistige Sammlung, die durch Pausen und Verpflegung erhalten bleibt."},{"word":"GETRAENKE","hint":"Werden bereitgestellt, um Konzentration und Wohlbefinden zu fördern."},{"word":"RAUM","hint":"Wird reserviert und mit Technik für die Sitzung vorbereitet."},{"word":"MEDIEN","hint":"Technische Hilfsmittel zur Darstellung von Inhalten im Sitzungsraum."},{"word":"TECHNIK","hint":"Wird vor Sitzungsbeginn geprüft und getestet."},{"word":"MIKROFON","hint":"Gerät zur Tonaufnahme; bei Videokonferenzen stummschalten wenn man schweigt."},{"word":"KAMERA","hint":"Bildgerät, das bei Videokonferenzen eingeschaltet sein sollte."},{"word":"INTERNET","hint":"Schneller Anschluss dieser Art wird für Videokonferenzen benötigt."},{"word":"PLATTFORM","hint":"Software wie Teams, Zoom oder Webex für Online-Treffen."},{"word":"HINTERGRUND","hint":"Sollte bei Videokonferenzen ruhig und aufgeräumt sein."},{"word":"AGENDA","hint":"Klare Themenliste, die eine Online-Sitzung strukturiert."},{"word":"ZEITPLAN","hint":"Festgelegte Zeiten für die einzelnen Punkte."},{"word":"ZEITRAHMEN","hint":"Vorgesehene Gesamtdauer, die eingehalten werden soll."},{"word":"PUENKTLICHKEIT","hint":"Rechtzeitiger Beginn, auch wenn noch nicht alle da sind."},{"word":"REDEBEITRAG","hint":"Wortmeldung, um die sich jeder kurz bemühen soll."},{"word":"REDNER","hint":"Sprechende Person, der man nicht ins Wort fallen soll."},{"word":"KOMMUNIKATION","hint":"Respektvoller Austausch unter gleichwertigen Gesprächspartnern."},{"word":"GESPRAECH","hint":"Mündlicher Austausch; Binnenformen davon stören die Sitzung."},{"word":"VERANTWORTUNG","hint":"Nicht nur die Leitung, auch die Teilnehmer tragen sie für das Gelingen."},{"word":"ERGEBNIS","hint":"Festgehaltenes Resultat, für das die Leitung sorgt."},{"word":"PLANUNG","hint":"Sorgfältiges Vorausdenken, ohne das Sitzungen ineffektiv verlaufen."},{"word":"VORBEREITUNG","hint":"Klärung aller Punkte, bevor die Zusammenkunft beginnt."},{"word":"DURCHFUEHRUNG","hint":"Der eigentliche Verlauf der Sitzung nach der Planung."},{"word":"NACHVERFOLGUNG","hint":"Kontrolle, ob gefasste Beschlüsse auch umgesetzt werden."},{"word":"GESELLSCHAFTER","hint":"Miteigentümer einer GmbH, die per Einschreiben geladen werden."},{"word":"VERSAMMLUNG","hint":"Offizielle Zusammenkunft, z. B. der GmbH-Miteigentümer."},{"word":"EINSCHREIBEN","hint":"Nachweisbare Briefform für die Ladung nach § 51 GmbHG."},{"word":"ANMELDUNG","hint":"Für außerbetriebliche Teilnehmer geforderte Rückmeldung."},{"word":"TEAMSITZUNG","hint":"Regelmäßiges internes Treffen, oft 2 bis 3 Tage vorher geplant."},{"word":"SORTIMENT","hint":"Warenangebot; Beispielthema für einen präzisen Tagesordnungspunkt."},{"word":"GENEHMIGUNG","hint":"Wiederkehrender Punkt: Bestätigung des letzten Protokolls."},{"word":"ABSTIMMUNG","hint":"Gemeinsames Festlegen eines passenden Termins."},{"word":"RESERVIERUNG","hint":"Verbindliches Freihalten des benötigten Raums."},{"word":"EROEFFNUNG","hint":"Beginn der Sitzung durch die Leitung."},{"word":"IDEENSAMMLUNG","hint":"Zusammentragen von Vorschlägen als Ziel eines Punkts."},{"word":"REIHENFOLGE","hint":"Festgelegte Ordnung, in der die Punkte behandelt werden."}];
const MAX_WRONG = 6;
const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜß'.split('');
const STORAGE = 'hangman_' + DAY_ID;

let target='', hint='', wrong=0, guessed=new Set(), over=false, lastIdx=-1;
function pickWord(){ let i; do { i=Math.floor(Math.random()*WORDS.length); } while(WORDS.length>1 && i===lastIdx); lastIdx=i; return WORDS[i]; }

function loadStats(){ try { return JSON.parse(localStorage.getItem(STORAGE)) || {played:0,won:0}; } catch(e){ return {played:0,won:0}; } }
function saveStats(s){ try { localStorage.setItem(STORAGE, JSON.stringify(s)); } catch(e){} }
function renderStats(){ const s=loadStats(); document.getElementById('stats').textContent = `Gespielt: ${s.played} · Gewonnen: ${s.won}`; }

function newGame(){
  const pick = pickWord();
  target = pick.word.toUpperCase(); hint = pick.hint;
  wrong=0; guessed=new Set(); over=false;
  document.getElementById('hintText').textContent = hint;
  document.getElementById('msg').textContent=''; document.getElementById('msg').className='msg';
  for(let i=0;i<MAX_WRONG;i++) document.getElementById('p'+i).style.display='none';
  buildWord(); buildKeyboard(); updateLives();
}

function buildWord(){
  const w=document.getElementById('word'); w.innerHTML='';
  for(const ch of target){
    const s=document.createElement('div'); s.className='slot';
    if(guessed.has(ch) || over){ s.textContent=ch; s.classList.add('revealed'); }
    w.appendChild(s);
  }
}
function buildKeyboard(){
  const kb=document.getElementById('keyboard'); kb.innerHTML='';
  ALPHABET.forEach(ch=>{
    const b=document.createElement('button'); b.className='key'; b.textContent=ch;
    if(guessed.has(ch)){ b.disabled=true; b.classList.add(target.includes(ch)?'right':'wrong'); }
    if(over) b.disabled=true;
    b.onclick=()=>guess(ch);
    kb.appendChild(b);
  });
}
function updateLives(){ document.getElementById('lives').textContent = `Fehlversuche: ${wrong} / ${MAX_WRONG}`; }

function guess(ch){
  if(over || guessed.has(ch)) return;
  guessed.add(ch);
  if(target.includes(ch)){ buildWord(); buildKeyboard(); checkWin(); }
  else { wrong++; document.getElementById('p'+(wrong-1)).style.display='block'; updateLives(); buildKeyboard(); if(wrong>=MAX_WRONG) lose(); }
}
function checkWin(){ if([...target].every(c=>guessed.has(c))){ over=true; const m=document.getElementById('msg'); m.textContent='🎉 Gewonnen! '+target; m.className='msg win'; const s=loadStats(); s.played++; s.won++; saveStats(s); renderStats(); buildKeyboard(); } }
function lose(){ over=true; const m=document.getElementById('msg'); m.textContent='Verloren! Das Wort war: '+target; m.className='msg lose'; buildWord(); buildKeyboard(); const s=loadStats(); s.played++; saveStats(s); renderStats(); }

document.addEventListener('keydown', e=>{ const c=e.key.toUpperCase(); if(/^[A-ZÄÖÜß]$/.test(c)) guess(c); });

renderStats(); newGame();
</script>
</body>
</html>
